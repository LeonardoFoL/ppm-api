name: CI - Build & Test Backend


on:
  push:
    branches:
      - develop
      - feature
      - hotfix

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' 
          cache: 'maven' 

      
      - name: Run Unit Tests
        run: mvn test

     
      - name: Package Application
        run: mvn clean package -DskipTests